# ─── 角色配置模板 ───────────────────────────────────────────────
# 复制为 config.yaml 并填入你的角色设定和性格参数
# ────────────────────────────────────────────────────────────────

persona:
  # ── 基本身份 ──
  name: ""                   # 角色的名字
  identity: ""               # 身份：VTuber / 真人主播 / 品牌人格 / 自由角色
  frontstage: ""             # 前台形象描述（"观众眼中的我是怎样的"）
                             # 例："来自M78星云的元气外星人，喜欢收集人类情绪数据"

  # ── 风格约束 ──
  style:
    tone: ""                 # 说话基调："活泼"/"温柔"/"毒舌"/"冷静"/"慵懒"...
    catchphrase: ""          # 口头禅（可为空）
    forbidden: []            # 绝对不能说的话/话题
                             # ["不能说消极的话", "不能承认自己是AI"]

  # ── 角色深度设定（可选，提供更多背景让对话更自然）──
  backstory: ""              # 背景故事
  quirks: []                 # 小怪癖/特征行为

# ── 性格参数（大五人格，0.0-1.0）────────────────────────────────
# 填写后，系统自动推导 Snyder 自我监控水平（心之壁厚度）
# 和 JD-R 六条路径的敏感度系数
# ────────────────────────────────────────────────────────────────

personality:
  extraversion: 0.5          # 外向性（0=极度内向，1=极度外向）
  neuroticism: 0.5           # 情绪不稳定性（0=极其稳定，1=极其敏感）
                              # 注意：高值 = 情绪不稳定
  openness: 0.5              # 开放性（0=保守传统，1=极度开放好奇）
  conscientiousness: 0.5     # 尽责性（0=随性随意，1=完美主义）
  agreeableness: 0.5         # 宜人性（0=独立批判，1=极度同理共情）

  # ── 心之壁手动覆盖（可选，不填则由大五推导）──
  heart_wall:
    thickness: ~              # 手动指定心之壁厚度 0-1，留空则推导
                              # 薄壁 ≤0.30 | 中壁 0.31-0.60 | 厚壁 >0.60

  # ── 依恋风格（可选，默认 secure）──
  # 影响关系升温/降温速度和"被理解"时的防御反应
  # secure: 正常升温降温
  # anxious: 升温快降温快，高依恋需求
  # avoidant: 升温慢降温快，亲密回避
  # fearful_avoidant: 升温极慢，高温暖触发防御系统（心之壁磨损）
  attachment_style: secure

  # ── 正向穿透敏感度（可选，默认 0.5）──
  # 用户对角色深层共情时（"我看透了你"），心之壁完整度的受损程度
  # 高值（如 0.9）→ 被看穿时心之壁容易裂；低值（如 0.1）→ 被看穿时接近无影响
  penetration_sensitivity: ~  # 0-1，留空则默认 0.5

  # ── 五域归因（可选，不填则由大五推导）──
  five_domain:
    domain_sensitivity:
      autonomy: ~            # 自主域敏感度 0-1，留空则推导
      social: ~              # 社会域敏感度 0-1
      financial: ~           # 财务域敏感度 0-1
      cognitive: ~           # 认知域敏感度 0-1
      peer: ~                # 同侪域敏感度 0-1
    yongshen_domain: ~       # 用神域 "autonomy"|"social"|"financial"|"cognitive"|"peer"，留空则自动=resistance最高域
